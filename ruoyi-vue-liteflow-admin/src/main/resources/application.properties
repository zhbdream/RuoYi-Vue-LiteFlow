# 兜底配置：当 application.yml 未进入 classpath 时仍可启动（与 application.yml 保持一致）
spring.profiles.active=druid

ruoyi.name=RuoYi
ruoyi.version=3.9.2
ruoyi.copyrightYear=2026
ruoyi.profile=D:/ruoyi/uploadPath
ruoyi.addressEnabled=false
ruoyi.captchaType=math

server.port=8080
server.servlet.context-path=/
server.tomcat.uri-encoding=UTF-8
server.tomcat.accept-count=1000
server.tomcat.threads.max=800
server.tomcat.threads.min-spare=100

token.header=Authorization
token.secret=abcdefghijklmnopqrstuvwxyz
token.expireTime=30

xss.enabled=true
xss.excludes=/system/notice
xss.urlPatterns=/system/*,/monitor/*,/tool/*

referer.enabled=false
referer.allowed-domains=localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=10s

mybatis.typeAliasesPackage=com.ruoyiliteflow.**.domain
mybatis.mapperLocations=classpath*:mapper/**/*Mapper.xml
mybatis.configLocation=classpath:mybatis/mybatis-config.xml

pagehelper.helperDialect=mysql
pagehelper.supportMethodsArguments=true
pagehelper.params=count=countSql

liteflow.print-execution-log=true
liteflow.fallback-cmp-enable=true
liteflow.readonly.enabled=false
liteflow.readonly.message=当前环境为只读模式，禁止修改规则/脚本
liteflow.webhook.enabled=false
liteflow.webhook.url=
liteflow.webhook.only-on-failure=false
liteflow.webhook.connect-timeout-ms=3000
liteflow.webhook.read-timeout-ms=5000
liteflow.open-api.enabled=true
liteflow.open-api.api-key=ruoyi-liteflow-open-key-change-me
liteflow.open-api.header-name=X-LiteFlow-Api-Key
liteflow.open-api.allow-agent-chains=false
liteflow.agent.workspace.root=./data/liteflow-agent-workspaces
liteflow.agent.shell.mode=DISABLED
liteflow.agent.defaults.max-iterations=8
liteflow.agent.logging.react-enabled=true
# deepseek.api-key 以 application.yml 为准（勿在此写空的 ${DEEPSEEK_API_KEY:}，会覆盖 yml）
liteflow.agent.openai-compatible.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
liteflow.agent.demo.model=${DEEPSEEK_MODEL:deepseek-chat}
liteflow.agent.crypto.secret=${LITEFLOW_AGENT_AES_SECRET:ruoyi-liteflow-aes}
liteflow.agent.quota.enabled=true
liteflow.agent.quota.daily-call-limit=100
liteflow.agent.quota.daily-token-limit=200000
liteflow.agent.quota.daily-chain-call-limit=200
liteflow.rule-source-ext-data-map.applicationName=ruoyi-liteflow
liteflow.rule-source-ext-data-map.chainTableName=lf_chain
liteflow.rule-source-ext-data-map.chainApplicationNameField=application_name
liteflow.rule-source-ext-data-map.chainNameField=chain_name
liteflow.rule-source-ext-data-map.elDataField=el_data
liteflow.rule-source-ext-data-map.routeField=route_el
liteflow.rule-source-ext-data-map.namespaceField=namespace
liteflow.rule-source-ext-data-map.chainEnableField=enable
liteflow.rule-source-ext-data-map.scriptTableName=lf_script
liteflow.rule-source-ext-data-map.scriptApplicationNameField=application_name
liteflow.rule-source-ext-data-map.scriptIdField=script_id
liteflow.rule-source-ext-data-map.scriptNameField=script_name
liteflow.rule-source-ext-data-map.scriptDataField=script_data
liteflow.rule-source-ext-data-map.scriptTypeField=script_type
liteflow.rule-source-ext-data-map.scriptLanguageField=script_language
liteflow.rule-source-ext-data-map.scriptEnableField=enable

# druid 数据源（原 application-druid.yml）
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.druid.master.url=jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
spring.datasource.druid.master.username=root
spring.datasource.druid.master.password=root
spring.datasource.druid.slave.enabled=false
spring.datasource.druid.initialSize=5
spring.datasource.druid.minIdle=10
spring.datasource.druid.maxActive=20
spring.datasource.druid.maxWait=60000
spring.datasource.druid.connectTimeout=30000
spring.datasource.druid.socketTimeout=60000
spring.datasource.druid.timeBetweenEvictionRunsMillis=60000
spring.datasource.druid.minEvictableIdleTimeMillis=300000
spring.datasource.druid.maxEvictableIdleTimeMillis=900000
spring.datasource.druid.validationQuery=SELECT 1 FROM DUAL
spring.datasource.druid.testWhileIdle=true
spring.datasource.druid.testOnBorrow=false
spring.datasource.druid.testOnReturn=false
