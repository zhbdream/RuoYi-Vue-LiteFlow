<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Agent</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#0f1419;color:#e7ecf3}
    main{max-width:720px;margin:0 auto;padding:24px}
    textarea{width:100%;background:#1a2332;border:1px solid #334155;color:#e7ecf3;border-radius:10px;padding:10px;box-sizing:border-box}
    button{margin-top:10px;background:#3d8bfd;border:0;color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer}
    pre{background:#111827;padding:12px;border-radius:10px;white-space:pre-wrap}
    a{color:#3dd68c}
  </style>
</head>
<body>
<main>
  <h1>RAG Agent :8093</h1>
  <p>经 MCP 调 <code>rag_ask</code>。<a href="http://localhost:8090/">回 MCP Playground</a></p>
  <textarea id="msg" rows="4">下单后第5天衣服尺码不合适，可以退货或换货吗？运费谁承担？</textarea>
  <button onclick="send()">提问</button>
  <pre id="out">…</pre>
</main>
<script>
async function send(){
  const r=await fetch('/agent/rag/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.getElementById('msg').value})});
  document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);
}
</script>
</body>
</html>
