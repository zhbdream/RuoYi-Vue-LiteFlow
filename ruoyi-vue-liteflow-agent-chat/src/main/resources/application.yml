server.port: 8091

ruoyi:
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
  agent:
    chat:
      use-mcp: true
      mcp-base-url: http://localhost:8090
      mcp-api-key: ${RUOYI_MCP_API_KEY:ruoyi-mcp-key-change-me}
      mcp-header-name: X-MCP-Api-Key
      system-prompt: 你是 RuoYi-Vue-LiteFlow 内部助手，回答简洁、准确，使用中文。

spring:
  application:
    name: ruoyi-agent-chat
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

logging:
  level:
    com.ruoyiliteflow: info
