<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuoYi MCP Playground</title>
  <style>
    :root { --bg:#0f1419; --panel:#1a2332; --text:#e7ecf3; --muted:#8b9bb4; --accent:#3d8bfd; --ok:#3dd68c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:linear-gradient(160deg,#0f1419,#182433 50%,#121820); color:var(--text); min-height:100vh; }
    header { padding:28px 24px 8px; max-width:960px; margin:0 auto; }
    h1 { margin:0 0 8px; font-size:1.6rem; letter-spacing:.02em; }
    p { color:var(--muted); margin:0 0 16px; line-height:1.5; }
    main { max-width:960px; margin:0 auto; padding:8px 24px 40px; display:grid; gap:16px; }
    .card { background:var(--panel); border:1px solid #2a3548; border-radius:14px; padding:16px 18px; }
    label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px; }
    input, select, textarea { width:100%; background:#0f1622; border:1px solid #334155; color:var(--text); border-radius:10px; padding:10px 12px; font:inherit; }
    textarea { min-height:110px; font-family:ui-monospace, Consolas, monospace; font-size:.85rem; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 16px; font-weight:600; cursor:pointer; }
    button.secondary { background:#334155; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    pre { background:#0b111a; border-radius:10px; padding:12px; overflow:auto; max-height:360px; font-size:.82rem; white-space:pre-wrap; word-break:break-word; }
    .agents a { color:var(--ok); margin-right:12px; text-decoration:none; }
    .tag { display:inline-block; background:#243044; color:#9ec1ff; border-radius:999px; padding:2px 10px; font-size:.75rem; margin-left:8px; }
  </style>
</head>
<body>
  <header>
    <h1>MCP Playground <span class="tag">Phase 7</span></h1>
    <p>系统能力封装为 MCP Tools。默认 API Key：<code>ruoyi-mcp-key-change-me</code>。需配置 <code>DEEPSEEK_API_KEY</code> 才能调用 LLM 类 Tool。</p>
  </header>
  <main>
    <section class="card agents">
      <strong>AI Kit Boot 调试页</strong>
      <p style="margin-top:8px">先启动本 MCP(8090)，再启动 <code>AiKitBootApplication</code>（8091）。</p>
      <div>
        <a href="http://localhost:8091/" target="_blank">AI Kit Boot :8091</a>
        （Chat / Risk / RAG / Ops 合一）
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div>
          <label>API Key</label>
          <input id="apiKey" value="ruoyi-mcp-key-change-me" />
        </div>
        <div>
          <label>Server</label>
          <select id="server">
            <option value="ai-core">ai-core</option>
            <option value="lf-governance">lf-governance</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="secondary" onclick="loadInfo()">GET /mcp/info</button>
        <button type="button" class="secondary" onclick="loadTools()">列出 Tools</button>
      </div>
      <label style="margin-top:12px">Tool</label>
      <select id="tool"></select>
      <label style="margin-top:12px">Arguments (JSON)</label>
      <textarea id="args">{
  "userMessage": "用一句话介绍 RuoYi-Vue-LiteFlow",
  "principal": "demo"
}</textarea>
      <div class="actions">
        <button type="button" onclick="callTool()">调用 Tool</button>
      </div>
    </section>

    <section class="card">
      <label>响应</label>
      <pre id="out">等待操作…</pre>
    </section>
  </main>
  <script>
    const out = document.getElementById('out');
    const headers = () => ({ 'Content-Type': 'application/json', 'X-MCP-Api-Key': document.getElementById('apiKey').value });
    function show(data) { out.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2); }
    async function loadInfo() {
      const r = await fetch('/mcp/info'); show(await r.json());
    }
    async function loadTools() {
      const server = document.getElementById('server').value;
      const r = await fetch('/mcp/' + server + '/tools', { headers: headers() });
      const json = await r.json();
      show(json);
      const sel = document.getElementById('tool');
      sel.innerHTML = '';
      (json.data || []).forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.name; opt.textContent = t.name + ' — ' + (t.description || '');
        sel.appendChild(opt);
      });
      if (server === 'lf-governance') {
        document.getElementById('args').value = '{\n  "chainId": "helloChain",\n  "limit": 5\n}';
      }
    }
    async function callTool() {
      const server = document.getElementById('server').value;
      const tool = document.getElementById('tool').value;
      let body = {};
      try { body = JSON.parse(document.getElementById('args').value || '{}'); }
      catch (e) { show('Arguments JSON 无效: ' + e.message); return; }
      const r = await fetch('/mcp/' + server + '/tools/' + tool, { method: 'POST', headers: headers(), body: JSON.stringify(body) });
      show(await r.json());
    }
    loadInfo();
  </script>
</body>
</html>
