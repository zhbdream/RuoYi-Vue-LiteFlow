server.port: 8090

ruoyi:
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
  mcp:
    enabled: true
    transport: http
    auth:
      api-key: ${RUOYI_MCP_API_KEY:ruoyi-mcp-key-change-me}
      header-name: X-MCP-Api-Key
    servers:
      ai-core: true
      lf-governance: true
      lf-runtime: false
      sys: false
    # 默认关闭；启用 profile=dynamic 或显式设为 true，并从 DB 加载 ai_tool(mcp)
    dynamic-tools:
      enabled: false

spring:
  application:
    name: ruoyi-ai-kit-mcp
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

logging:
  level:
    com.ruoyiliteflow: info
