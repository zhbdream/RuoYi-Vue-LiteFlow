# 启用：--spring.profiles.active=platform
# 先执行 sql/phase8_ai_kit_platform.sql

ruoyi:
  ai-kit:
    platform:
      enabled: true

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${AIKIT_DB_HOST:localhost}:${AIKIT_DB_PORT:3306}/${AIKIT_DB_NAME:ry-vue}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${AIKIT_DB_USER:root}
    password: ${AIKIT_DB_PASSWORD:password}

mybatis:
  typeAliasesPackage: com.ruoyiliteflow.aikit.platform.domain
  mapperLocations: classpath*:mapper/aikit/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
