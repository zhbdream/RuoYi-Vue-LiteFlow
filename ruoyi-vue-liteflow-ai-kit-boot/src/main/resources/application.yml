server.port: 8091

ruoyi:
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    crypto:
      secret: ${RUOYI_AI_AES_SECRET:${LITEFLOW_AGENT_AES_SECRET:ruoyi-liteflow-aes}}
  ai-kit:
    use-mcp: true
    mcp-base-url: http://localhost:8090
    mcp-api-key: ${RUOYI_MCP_API_KEY:ruoyi-mcp-key-change-me}
    mcp-header-name: X-MCP-Api-Key
    platform:
      enabled: false

spring:
  application:
    name: ruoyi-ai-kit-boot
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

logging:
  level:
    com.ruoyiliteflow: info
